server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Build assets are content-hashed, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names the hashes, so caching it would pin an old build.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: any unknown path is a client-side route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
