# The two workloads, as one ApplicationSet.
#
# A list generator rather than two Application files, because the two are the same
# shape with different elements and the element is where a future third workload is
# added — one line, and the diff says which workload appeared.
#
# `goTemplate: true` is required: the default fasttemplate engine does not
# understand `{{ .name }}`, and the generated names come out as the literal, which
# the controller rejects as a duplicate.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: charts
  namespace: argocd
spec:
  goTemplate: true

  generators:
    - list:
        elements:
          # name is the Application and the Helm release name, and it has to stay
          # `godough-api`/`godough-ui`: the chart's fullname helper is
          # `contains .Chart.Name .Release.Name`, so a different release name
          # renames the Deployment, Service and Ingress and Argo would create new
          # objects beside the running ones instead of adopting them.
          - name: godough-api
            chart: api
          - name: godough-ui
            chart: ui

  template:
    metadata:
      name: '{{ .name }}'
      namespace: argocd
    spec:
      project: default

      source:
        repoURL: https://github.com/saxeum/godough.git
        targetRevision: master
        path: 'deploy/charts/{{ .chart }}'
        helm:
          releaseName: '{{ .name }}'
          # Beside the chart, so no `$values` ref source is needed: Argo resolves
          # valueFiles relative to the chart path, and both charts live in this
          # repository.
          valueFiles:
            - values-staging.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: godough

      syncPolicy:
        automated:
          # selfHeal yes, prune no.
          #
          # selfHeal is the whole point: a hand-edit to the cluster is drift, and
          # the answer to drift is to put it back. prune is a different question,
          # and the answer here is no for now — with it on, a values key that stops
          # rendering an object deletes that object, so a typo takes the Ingress
          # (and the site) down and leaves the *repository* correct. Nothing runs
          # `make argocd-verify` on a loop; it runs when a human asks.
          #
          # Turning it on is a decision for when the values have settled, and the
          # deliberate act in the meantime is `make argocd-prune APP=…`, which
          # passes --prune to one sync and says so.
          prune: false
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
