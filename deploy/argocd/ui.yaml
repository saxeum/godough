apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: godough-ui
  namespace: argocd
  # No cascade finalizer on purpose: with it, `kubectl delete application` deletes
  # the Deployment, Service and Ingress with it. Deleting an Application should
  # stop managing objects, not take the site down; add it back when there is a
  # deliberate way to ask for the other behaviour.
spec:
  project: default

  source:
    repoURL: https://github.com/saxeum/godough.git
    targetRevision: master
    path: deploy/charts/ui

    helm:
      # The release name the Helm release already has, so `.Release.Name` renders
      # the same object names, and the `app.kubernetes.io/instance` label on the
      # running objects still matches what this Application would apply.
      releaseName: godough-ui

      valuesObject:
        image:
          repository: 619071335809.dkr.ecr.ap-southeast-2.amazonaws.com/godough-web
          digest: sha256:42ac6f55d9a0fb8dbd57b83b3fef4a017c718d8d75632753054300dc21e87688
        ingress:
          enabled: true
          host: godough.foonix.net
          certificateArn: arn:aws:acm:ap-southeast-2:619071335809:certificate/cb6649c5-cf18-4de0-a563-cb6dc922750c
          accessLogs:
            bucket: godough-alb-logs-619071335809
            prefix: godough
          wafAclArn: arn:aws:wafv2:ap-southeast-2:619071335809:regional/webacl/godough-edge/87976e4d-8f95-431a-94aa-b7d4a8b58ade

  destination:
    server: https://kubernetes.default.svc
    namespace: godough

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    automated:
      prune: false
      selfHeal: true

  revisionHistoryLimit: 3
