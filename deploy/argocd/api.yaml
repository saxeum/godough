apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: godough-api
  namespace: argocd
  # No cascade finalizer on purpose: with it, `kubectl delete application` deletes
  # the Deployment, Service and Ingress with it. Deleting an Application should
  # stop managing objects, not take the site down; add it back when there is a
  # deliberate way to ask for the other behaviour.
spec:
  project: default

  source:
    repoURL: https://github.com/saxeum/godough.git
    targetRevision: master
    path: deploy/charts/api

    helm:
      # Same release name the Helm release had, so `.Release.Name` renders the same
      # object names and the labels already on the objects still match. Without it
      # the chart's fullname helper produces `godough-api-api`.
      releaseName: godough-api

      # Values inline rather than in a file, because Argo resolves valueFiles
      # relative to the chart directory and this deployment's values are not the
      # chart's. One Application is one reviewable object; the digest in it is the
      # digest running.
      valuesObject:
        image:
          repository: 619071335809.dkr.ecr.ap-southeast-2.amazonaws.com/godough-api
          digest: sha256:e44ad80d76b53cebde15f5089fd4a2dd19fb6c84c3ec468d9d0121d382033e44
        trustedOrigins: https://godough.foonix.net
        databaseSecret:
          name: godough-api
          key: DATABASE_URL
        caSecret:
          name: godough-rds-ca
          key: global-bundle.pem
        oauthSecret:
          name: godough-oauth
        migrations:
          enabled: true
          ownerSecret: godough-owner
        ingress:
          enabled: true
          host: godough.foonix.net
          certificateArn: arn:aws:acm:ap-southeast-2:619071335809:certificate/cb6649c5-cf18-4de0-a563-cb6dc922750c
          accessLogs:
            bucket: godough-alb-logs-619071335809
            prefix: godough
          wafAclArn: arn:aws:wafv2:ap-southeast-2:619071335809:regional/webacl/godough-edge/87976e4d-8f95-431a-94aa-b7d4a8b58ade

  destination:
    server: https://kubernetes.default.svc
    namespace: godough

  # No `automated` yet. The first sync is a human reading the diff, because
  # Terraform still owns these objects and a silent reconciliation would be two
  # controllers arguing about the same Deployment. Turned on in the commit that
  # removes the helm_release from Terraform.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    # prune stays off until Argo has been the only writer for a while: a
    # mis-typed values key should not delete an Ingress.
    automated:
      prune: false
      selfHeal: false

  revisionHistoryLimit: 3
