services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: godough
      POSTGRES_PASSWORD: snippet
      POSTGRES_DB: snippet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godough -d snippet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SNIPPET_ADDR: ":4000"
      # In compose the database is the service name, not localhost.
      DATABASE_URL: postgres://godough_app:snippet_app@postgres:5432/snippet?sslmode=disable
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./ui

  lb:
    image: nginx:alpine
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
      - web

volumes:
  postgres-data:
