services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: godough
      POSTGRES_PASSWORD: snippet
      POSTGRES_DB: snippet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godough -d snippet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SNIPPET_ADDR: ":4000"
      # In compose the database is the service name, not localhost.
      DATABASE_URL: postgres://godough_app:snippet_app@postgres:5432/snippet?sslmode=disable
      # The UI is same-origin through the LB; the Vite dev server is not used
      # inside compose. Keep this list explicit rather than wildcarded.
      TRUSTED_ORIGINS: http://localhost:8080
      # Local Google credentials come from .env, which is gitignored. Empty
      # values keep sign-in disabled; the config parser rejects a partial set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./ui

  lb:
    image: nginx:alpine
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
      - web

volumes:
  postgres-data:
