# Local stand-in for the production ingress: one origin, routed by path.
# /api/* -> api, everything else -> web. Keep the two rules in step with the
# ingress; the API owns the /api prefix, so there is no rewrite here.

upstream api {
    server api:4000;
}

upstream web {
    server web:8080;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
