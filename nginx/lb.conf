# Local stand-in for the production ingress: one origin, routed by path.
# /api/* -> api, everything else -> web. Keep the two rules in step with the
# ingress; the API owns the /api prefix, so there is no rewrite here.

# Docker's embedded DNS. Without `resolve` the upstreams are looked up once, at
# startup, so recreating a container (every make stack-up) leaves the LB
# proxying a dead address until it is restarted too.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:4000 resolve;
}

upstream web {
    zone web 64k;
    server web:8080 resolve;
}

server {
    listen 80;
    server_name _;

    location /api-misrouted/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
