# Deployment values for the ui chart.
#
# The ui has no image digest of its own to decide beyond the release, and no
# Secrets: it serves static files and a fallback. The Ingress is shared with the
# api through the ALB group, so the edge settings have to agree.

image:
  repository: ${image_repository}
  digest: ${image_digest}

ingress:
  enabled: true
  host: ${ingress_host}
  certificateArn: ${certificate_arn}
  accessLogs:
    bucket: ${log_bucket}
    prefix: godough
  wafAclArn: ${waf_acl_arn}
