name: security

on:
  push:
    branches: [master]
  pull_request:
  # The vulnerability databases move without the repository changing, so a green
  # commit can go red on its own. Without this, the first signal is a blocked PR
  # at an inconvenient moment.
  schedule:
    - cron: "43 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reachability: vulnerable symbols this code can actually call, in the module
  # graph and the standard library. It cannot see what is in the image.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, runs on node24

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0, runs on node24
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: make vuln

  # Everything in the image: OS packages in the base layer plus the language
  # packages inside the binaries. Trivy cannot rank reachability; this job and
  # the one above are deliberately both here because neither subsumes the other.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, runs on node24

      - name: Build the images
        run: docker compose build api web

      # if: always() on both scans so a failing api scan still scans web, and so
      # every run uploads both SARIF files.
      - name: Scan godough-api
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: godough-api:latest
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          # Fixable findings only: a CVE with no fixed version cannot be resolved
          # by anyone and would block every merge until upstream acts. Those are
          # reported in the SARIF, not gated. See issue #26.
          ignore-unfixed: true
          # Without this the action rebuilds the SARIF with *all* severities and
          # takes the exit code from that run, so UNKNOWN/LOW findings fail the
          # gate. It has to match --severity or the gate says something else.
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Scan godough-web
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: godough-web:latest
          format: sarif
          output: trivy-web.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Without this the action rebuilds the SARIF with *all* severities and
          # takes the exit code from that run, so UNKNOWN/LOW findings fail the
          # gate. It has to match --severity or the gate says something else.
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload api results
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload web results
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

  # Static policy on the Terraform itself: no AWS credentials, runs on every
  # pull request, and catches a public bucket or a wide IAM trust before apply.
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, runs on node24

      - name: Scan Terraform config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          skip-dirs: "**/.terraform"
          exit-code: "1"

  # Live invariants after apply and weekly: the account state, not just the
  # Terraform source. OIDC only; no static AWS keys.
  aws-test:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, runs on node24

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0, runs on node24
        with:
          go-version-file: infra/aws-test/go.mod
          cache: true

      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Scan the live account
        run: make aws-test
