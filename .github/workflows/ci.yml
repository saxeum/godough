name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # The job name is what branch protection requires: "test".
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: godough
          POSTGRES_PASSWORD: snippet
          POSTGRES_DB: snippet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U godough -d snippet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The tests run as the application role, so the grants they exercise are
      # the grants production has. The owner's credentials are only for the
      # steps that create things. This service is an ephemeral local network,
      # like compose: it has no TLS certificate, so plaintext is deliberate.
      TEST_DATABASE_URL: postgres://godough_app:snippet_app@localhost:5432/snippet_test?sslmode=disable
      TEST_DATABASE_URL_OWNER: postgres://godough:snippet@localhost:5432/snippet_test?sslmode=disable
      DATABASE_URL_OWNER: postgres://godough:snippet@localhost:5432/snippet?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, runs on node24

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0, runs on node24
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The contract is generated from spec/openapi.yaml into both languages.
      # Node is here for orval; the Go half comes from the Go toolchain above.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, runs on node24
        with:
          # Must match the build stage in ui/Dockerfile.
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      # gofmt, staticcheck and oxlint. It runs before the image build, so a
      # formatting or lint error fails in seconds rather than in a Docker layer.
      - name: Lint
        run: make lint

      # Regenerates and fails if the committed output changed. A hand-edited
      # generated file, or a spec change nobody regenerated, lands here.
      - name: Generated code is up to date
        run: make codegen-check

      - name: UI tests
        run: npm --prefix ui test

      - name: UI build
        run: npm --prefix ui run build

      - name: Create the test database
        run: psql "$DATABASE_URL_OWNER" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE snippet_test'

      - name: Bootstrap the application role on the test database
        run: psql "$TEST_DATABASE_URL_OWNER" -v ON_ERROR_STOP=1 -1 -f db/bootstrap.sql

      - name: Migrate the test database
        run: DATABASE_URL_OWNER="$TEST_DATABASE_URL_OWNER" go run ./cmd/migrate -dir migrations

      # -count=1: the database is external state the test cache cannot see.
      # -race: the auth work adds concurrency; find races before it lands.
      - name: Test
        run: make test-race

  # The stack as a user sees it: real images, real LB, real database. The
  # browser half is Chrome from the runner image (REQUIRE_BROWSER=1 makes its
  # absence a failure rather than a skip).
  e2e:
    runs-on: ubuntu-latest
    env:
      # make db-migrate runs the migrator on the host, against compose's published port.
      DATABASE_URL_OWNER: postgres://godough:snippet@127.0.0.1:5432/snippet?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, runs on node24

      - name: Start the stack
        run: docker compose up -d --wait --build

      - name: Migrate
        run: make db-migrate

      - name: End-to-end checks
        run: REQUIRE_BROWSER=1 make e2e

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v

  # Build once and publish by commit SHA. Only master, and only after the tests
  # that prove the tree can ship. The workflow assumes the ECR role through
  # GitHub OIDC; there are no static AWS keys.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, runs on node24

      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve registry and tag
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${account}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push
        run: make ecr-push
